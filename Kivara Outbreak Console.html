<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kivara Outbreak Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#EEF1EE; --panel:#FFFFFF; --panel2:#F6F8F6; --line:#D5DCD7; --ink:#18221E; --muted:#5B6B64;
  --accent:#D99A00; --accent-ink:#3B2A00; --green:#1F6F5C; --red:#B8402B; --blue:#2A5DA8;
  --code-bg:#FBFCFB; --sel:#FFE9A8; --shadow:0 1px 2px rgba(20,40,30,.08),0 4px 16px rgba(20,40,30,.06);
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace; --sans:"Chivo",system-ui,Segoe UI,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ground:#0F1412; --panel:#161D1A; --panel2:#1B2420; --line:#2B3833; --ink:#E3EAE6; --muted:#93A59D;
  --accent:#F2B42A; --accent-ink:#2A1E00; --green:#4FB896; --red:#EF7A63; --blue:#7FA8F0; --code-bg:#121916; --sel:#4A3B10;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#0F1412; --panel:#161D1A; --panel2:#1B2420; --line:#2B3833; --ink:#E3EAE6; --muted:#93A59D;
  --accent:#F2B42A; --accent-ink:#2A1E00; --green:#4FB896; --red:#EF7A63; --blue:#7FA8F0; --code-bg:#121916; --sel:#4A3B10;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
code,pre,textarea,#src,#cin,#console,.editor{font-variant-ligatures:none!important;font-feature-settings:"liga" 0,"calt" 0!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;padding-inline:12px;padding-block:10px}
button{font-family:var(--sans);cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:grid;grid-template-rows:auto 1fr;gap:10px;height:100%;min-height:640px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:19px;font-weight:900;letter-spacing:-.01em;margin:0}
.brand .tag{font:600 11px var(--mono);color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:3px;letter-spacing:.04em}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;display:flex;flex-direction:column;min-width:86px}
.stat b{font:600 15px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat.clock b{color:var(--red)}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:var(--shadow)}
.tabs{display:flex;align-items:center;gap:2px;background:var(--panel2);border-bottom:1px solid var(--line);padding:0 6px;min-height:34px;flex-wrap:wrap}
.tab{background:none;border:0;padding:8px 10px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .spacer{flex:1}
.tbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:3px 8px;font-size:11.5px;margin-left:4px}
.tbtn.run{background:var(--green);color:#fff;border-color:transparent}
.body{flex:1;min-height:0;overflow:auto;position:relative}
/* editor */
.editor{display:flex;height:100%;font:13px/1.55 var(--mono);background:var(--code-bg)}
.gutter{padding:8px 6px 8px 10px;color:var(--muted);text-align:right;user-select:none;opacity:.6;white-space:pre;overflow:hidden}
#src{flex:1;border:0;resize:none;background:transparent;color:var(--ink);font:inherit;padding:8px 10px;white-space:pre;overflow:auto;tab-size:2}
#src::selection{background:var(--sel)}
/* console */
#console{font:12.5px/1.5 var(--mono);padding:8px 10px;background:var(--code-bg);white-space:pre-wrap;word-break:break-word;height:100%;overflow:auto}
#console .in{color:var(--blue)}
#console .err{color:var(--red)}
#console .warn{color:var(--accent)}
#console .msg{color:var(--muted)}
#console .ok{color:var(--green)}
.prompt-row{display:flex;gap:6px;align-items:flex-start}
.prompt-row .p{color:var(--blue);font-weight:600}
#cin{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;padding:0;outline:none;resize:none;height:1.5em;overflow:hidden}
/* mission */
.mission{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.mhead{display:flex;align-items:flex-start;gap:12px}
.mnum{font:800 11px var(--mono);color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:3px 6px;white-space:nowrap}
.mhead h2{margin:0;font-size:18px;font-weight:900;text-wrap:balance;line-height:1.2}
.mhead .src{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.brief{line-height:1.55;max-width:68ch;margin:0}
.brief code,.task code,.card code{font:12px var(--mono);background:var(--panel2);border:1px solid var(--line);padding:0 4px;border-radius:3px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;gap:9px;align-items:flex-start;line-height:1.45;padding:7px 9px;border-radius:6px;background:var(--panel2)}
.task .box{flex:none;width:18px;height:18px;border:2px solid var(--line);border-radius:4px;margin-top:1px;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff}
.task.done .box{background:var(--green);border-color:var(--green)}
.task.done .t{color:var(--muted)}
.answer{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.answer input{font:13px var(--mono);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:4px 8px;width:140px}
.answer button,.choice{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:4px 10px;font-size:12.5px}
.choices{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.choice{text-align:left}
.choice.right{background:var(--green);color:#fff;border-color:var(--green)}
.choice.wrong{text-decoration:line-through;opacity:.6}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hintbox{border-left:0;background:var(--panel2);border:1px dashed var(--line);border-radius:6px;padding:9px 11px;font-size:13px;line-height:1.5}
.hintbox pre{font:12px/1.5 var(--mono);margin:6px 0 0;white-space:pre-wrap}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{width:26px;height:6px;border-radius:3px;background:var(--line)}
.step.done{background:var(--green)}.step.cur{background:var(--accent)}
/* env */
table.env{width:100%;border-collapse:collapse;font:12px var(--mono)}
table.env td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.env td:first-child{font-weight:600;white-space:nowrap}
table.env td:last-child{color:var(--muted)}
.files{padding:8px 0}
.empty{padding:16px;color:var(--muted);font-size:13px}
/* plot */
.plotwrap{height:100%;display:flex;align-items:center;justify-content:center;background:var(--panel);padding:6px}
#plot{max-width:100%;max-height:100%;background:#fff;border-radius:4px}
.checklist{display:flex;gap:6px;flex-wrap:wrap;padding:6px 8px;border-top:1px solid var(--line);background:var(--panel2);font-size:11.5px}
.chip{padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(10,15,12,.55);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--panel);color:var(--ink);border-radius:10px;max-width:640px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:90vh;overflow:auto;line-height:1.55}
.card h2{margin:0 0 6px;font-size:22px;font-weight:900;text-wrap:balance}
.card img{width:100%;border:1px solid var(--line);border-radius:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:8px;font-weight:600;z-index:30;box-shadow:var(--shadow)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font:600 11px var(--mono);padding:3px 8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.badge.got{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#console .explain{color:var(--green);font-style:italic}
.task .t{flex:1;min-width:0}
.why{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tplbtn{margin-top:5px;border:1px dashed var(--green);background:transparent;color:var(--green);border-radius:4px;padding:2px 8px;font:600 11.5px var(--mono)}
.task.done .tplbtn{display:none}
.stepbtns{display:flex;gap:6px;flex-wrap:wrap}
.revbtn{margin-top:5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:4px;padding:2px 8px;font:600 11.5px var(--sans)}
.revbtn:hover{color:var(--ink);border-color:var(--accent)}
button.step{border:0;padding:0;cursor:pointer}button.step:hover{outline:2px solid var(--accent)}
.banner{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:25;background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:8px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:min(680px,92vw)}
.banner button{border:0;background:rgba(0,0,0,.12);color:inherit;border-radius:4px;padding:3px 8px;font-weight:700}
.syncpill{font:600 11px var(--mono);padding:3px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.syncpill.on{color:var(--green);border-color:var(--green)}.syncpill.off{color:var(--red);border-color:var(--red)}
.joinform{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.joinform label{font-size:12px;font-weight:600;color:var(--muted)}
.joinform input{font:15px var(--sans);padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%}
.reuse{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:13px;line-height:1.5}
.reuse b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--green);display:block;margin-bottom:2px}
.optional{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sheetTabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:10px 0 0;flex-wrap:wrap}
.sheetTabs button{border:1px solid var(--line);border-bottom:0;background:var(--panel2);color:var(--ink);padding:5px 12px;font:600 12px var(--mono);border-radius:4px 4px 0 0}
.sheetTabs button[aria-selected="true"]{background:#e8f3ec;color:#14532d}
.xl{overflow:auto;max-height:50vh;border:1px solid var(--line)}
.xl table{border-collapse:collapse;font:12px var(--mono);background:#fff;color:#1b1b1b}
.xl th{background:#eef0ee;color:#555;font-weight:600;border:1px solid #d6d9d6;padding:3px 8px;position:sticky;top:0}
.xl td{border:1px solid #e1e3e1;padding:3px 8px;white-space:nowrap}
.xl td.rn{background:#eef0ee;color:#777;text-align:right}
.pb{padding:14px 16px;display:flex;flex-direction:column;gap:12px;line-height:1.5}
.pb h2{margin:0;font-size:18px;font-weight:900}
.pbstep{display:grid;grid-template-columns:28px 1fr;gap:10px}
.pbn{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 12px var(--mono)}
.pbstep pre{font:12px/1.5 var(--mono);background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0 0;overflow-x:auto;white-space:pre}
.swap{overflow-x:auto}.swap table{border-collapse:collapse;font-size:12.5px;min-width:560px}
.swap th,.swap td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.swap th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (max-width:900px){
  .app{height:auto}
  .grid{grid-template-columns:1fr;grid-template-rows:auto}
  .pane{min-height:340px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">

<script>
// ===================== Synthetic district: Kivara (fictional) =====================
const CRS = {epsg:32735, name:"WGS 84 / UTM zone 35S"};
const GRID = {nx:200, ny:150, res:200, xmin:700000, ymax:9780000};
GRID.xmax = GRID.xmin + GRID.nx*GRID.res; GRID.ymin = GRID.ymax - GRID.ny*GRID.res;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RNG = mulberry32(20260923);
const rnd=(a=0,b=1)=>a+(b-a)*RNG();
const gauss=()=>{let u=RNG()||1e-9,v=RNG();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

function pointInPoly(x,y,ring){let ins=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const[xi,yi]=ring[i],[xj,yj]=ring[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}return ins}
function circlePoly(cx,cy,r,nv=28,jit=0){const out=[];for(let k=0;k<nv;k++){const a=2*Math.PI*k/nv;const rr=r*(1+(jit?jit*(RNG()-.5):0));out.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)])}out.push(out[0]);return out}

const DATA = (function build(){
  const cx=720000, cy=9765000;
  // district boundary
  const ring=[];for(let k=0;k<48;k++){const a=2*Math.PI*k/48;const r=1+0.09*Math.sin(3*a+1)+0.06*Math.sin(5*a+2)+0.03*(RNG()-.5);ring.push([cx+18300*r*Math.cos(a),cy+13300*r*Math.sin(a)])}ring.push(ring[0]);
  const inside=(x,y)=>pointInPoly(x,y,ring);
  const names=["Kivara Town","Mbere","Luhanga","Nyakisi","Rutobwe","Kasenge","Bwiza","Gatare","Mushimba","Rwamiko","Nkondo","Kabingo","Muyira","Tamba","Lusozi","Kigeme","Rugari","Ndekwe","Buhanda","Kiyovu","Masoro","Gisanze","Nyamata-East","Karama"];
  const setts=[];
  const fixed=[[714000,9768000,38000,1600],[731500,9764000,19000,1200],[708500,9759500,15000,1100],[724500,9774000,14000,1000],[735500,9759000,11000,950]];
  fixed.forEach((f,i)=>setts.push({name:names[i],x:f[0],y:f[1],P:f[2],s:f[3]}));
  while(setts.length<names.length){const x=rnd(703000,737000),y=rnd(9753000,9777500);if(!inside(x,y))continue;if(setts.some(s=>Math.hypot(s.x-x,s.y-y)<3200))continue;setts.push({name:names[setts.length],x,y,P:rnd(1800,7500),s:rnd(500,850)})}
  // river (north -> south-east, east side)
  const river=[];for(let k=0;k<=40;k++){const t=k/40;river.push([727000+9000*t+1800*Math.sin(t*7),9780500-31000*t])}
  const distRiver=(x,y)=>{let m=1e9;for(let k=0;k<river.length-1;k++){const[a,b]=river[k],[c,d]=river[k+1];const dx=c-a,dy=d-b;let t=((x-a)*dx+(y-b)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));m=Math.min(m,Math.hypot(x-a-t*dx,y-b-t*dy))}return m};
  const N=GRID.nx*GRID.ny;
  const pop=new Float32Array(N),u5=new Float32Array(N),ndvi=new Float32Array(N),rain=new Float32Array(N),mask=new Uint8Array(N);
  const storms=[[733000,9760000,6000,55],[726000,9756000,4000,35],[712000,9772000,4000,20]];
  for(let r=0;r<GRID.ny;r++)for(let c=0;c<GRID.nx;c++){
    const i=r*GRID.nx+c,x=GRID.xmin+(c+.5)*GRID.res,y=GRID.ymax-(r+.5)*GRID.res;
    if(!inside(x,y)){pop[i]=u5[i]=ndvi[i]=rain[i]=NaN;continue}
    mask[i]=1;let d=0,urb=0;
    for(const s of setts){const g=Math.exp(-((x-s.x)**2+(y-s.y)**2)/(2*s.s*s.s));d+=s.P*g/(2*Math.PI*s.s*s.s)*GRID.res*GRID.res;urb+=g*(s.P>9000?1:.4)}
    pop[i]=d+Math.max(0,4+3*gauss());
    u5[i]=pop[i]*(0.15+0.03*Math.sin(x/3000)+0.01*gauss());
    const dr=distRiver(x,y);

    if(t.obj.k!=="id")throw new RError("only simple  obj$col <- value  assignments are supported");
    const o=evalNode(t.obj,env);
    if(isDF(o)){const cp=cloneDF(o);let val=v;if(isDF(val)&&val.names.length){val=val.cols[val.names[val.names.length-1]]}
      val=vec(val);if(val.length===1)val=Array(cp.nrow).fill(val[0]);

  }
  if(t.k==="call"&&t.fn.k==="id"&&t.fn.v==="names")throw new RError("names<- is not supported here; use dplyr::rename()");
  throw new RError("invalid assignment target");
}
function cloneDF(d){const c={...d,names:d.names.slice(),cols:{}};d.names.forEach(n=>c.cols[n]=d.cols[n].slice());if(d.geom)c.geom=d.geom.slice();return c}

function doIndex(o,args,env,dbl){

    if(dbl){const k=sc(vals[0]);if(typeof k==="number")return o.cols[o.names[k-1]]??null;return o.cols[k]??null}
    if(vals.length===1){const cs=vec(vals[0]).map(x=>typeof x==="number"?o.names[x-1]:x);cs.forEach(c=>{if(!o.names.includes(c))throw new RError("undefined columns selected: "+c)});const n={...o,names:cs,cols:{}};cs.forEach(c=>n.cols[c]=o.cols[c]);return n}
    let [ri,ci]=vals;let d=o;

    if(ci!==undefined){const cs=vec(ci).map(x=>typeof x==="number"?d.names[x-1]:x);
      if(cs.length===1&&!d.geom)return d.cols[cs[0]]??(()=>{throw new RError("undefined columns selected")})();
      if(cs.length===1&&d.geom){ /* sf keeps geometry, but [ ,2] on an extract() data.frame returns the vector */ }
      if(cs.length===1)return d.cols[cs[0]];
      const n={...d,names:cs,cols:{}};cs.forEach(c=>n.cols[c]=d.cols[c]);return n}

function rowIdx(ix,n){if(!ix.length)return [];if(typeof ix[0]==="boolean"){const o=[];for(let i=0;i<n;i++)if(ix[i%ix.length])o.push(i);return o}

  return ix.map(x=>x-1)}

const OPF={"+":(a,b)=>a+b,"-":(a,b)=>a-b,"*":(a,b)=>a*b,"/":(a,b)=>a/b,"^":(a,b)=>a**b,"==":(a,b)=>a===b,"!=":(a,b)=>a!==b,"<":(a,b)=>a<b,">":(a,b)=>a>b,"<=":(a,b)=>a<=b,">=":(a,b)=>a>=b,"&":(a,b)=>!!a&&!!b,"&&":(a,b)=>!!a&&!!b,"|":(a,b)=>!!a||!!b,"||":(a,b)=>!!a||!!b};
const LOGICAL_OPS=new Set(["==","!=","<",">","<=",">=","&","&&","|","||"]);
function rmap(r,f,logical){const o={...r,data:new Float32Array(r.data.length),logical:!!logical,file:null};for(let i=0;i<r.data.length;i++){const x=r.data[i];o.data[i]=Number.isNaN(x)?NaN:+f(x)}return o}
function arith(op,l,r){
  const f=OPF[op];if(!f)throw new RError("operator "+op+" not supported");
  if(isR(l)||isR(r)){
    const lg=LOGICAL_OPS.has(op);
    if(isR(l)&&isR(r)){const o={...l,data:new Float32Array(l.data.length),logical:lg,file:null,name:lg?"layer":l.name,srcs:[...new Set([...(l.srcs||[l.src]),...(r.srcs||[r.src])])]};for(let i=0;i<l.data.length;i++){const a=l.data[i],b=r.data[i];o.data[i]=(Number.isNaN(a)||Number.isNaN(b))?NaN:+f(a,b)}emit("rastop",{op,l,r,out:o});return o}
    const rr=isR(l)?l:r,s=sc(isR(l)?r:l);const o=rmap(rr,x=>isR(l)?f(x,s):f(s,x),lg);o.name=lg?rr.name:rr.name;emit("rastop",{op,l,r,out:o});return o;
  }
  if(isDF(l)||isDF(r)){const d=isDF(l)?l:r;if(d.geom||!d.names.every(n=>typeOf(d.cols[n])==="numeric"))throw new RError("non-numeric argument to binary operator",{tip:"Pull a column out first, e.g.  df$column"});
    const o={...d,names:d.names.slice(),cols:{}};d.names.forEach(n=>{o.cols[n]=isDF(l)?arith(op,d.cols[n],r):arith(op,l,d.cols[n])});return o}
  const a=vec(l),b=vec(r);if(!a.length||!b.length)return [];
  const n=Math.max(a.length,b.length),out=new Array(n);
  for(let i=0;i<n;i++){const x=a[i%a.length],y=b[i%b.length];
    if(!LOGICAL_OPS.has(op)&&(typeof x==="string"||typeof y==="string"))throw new RError("non-numeric argument to binary operator");
    out[i]=(x===null||y===null)?null:f(x,y)}
  return out;
}

function callFn(fnNode,rawArgs,env){
  let def,name;
  if(fnNode.k==="id"){name=fnNode.v;def=FN[name];
    if(fnNode.pkg){if(!def)throw new RError("'"+name+"' is not an exported object from 'namespace:"+fnNode.pkg+"'");}
    else if(!def){const v=env.get(name);if(v&&v.type==="fn")def=v.def;else throw new RError("could not find function \""+name+"\"",{tip:didYouMean(name)})}
    else if(!R.loaded.has(def.pkg)&&!(def.pkg==="tidyverse")){
      throw new RError("could not find function \""+name+"\"",{tip:"'"+name+"()' lives in the {"+def.pkg+"} package. Load it first:  library("+def.pkg+")  or  pacman::p_load("+def.pkg+")"})}
  }else{const v=evalNode(fnNode,env);if(!v||v.type!=="fn")throw new RError("attempt to apply non-function");def=v.def;name=def.name}
  if(R.onCall)R.onCall(name);
  if(def.nse)return def.f(rawArgs,env,name);
  const args=rawArgs.map(a=>({name:a.name,value:a.value.k==="empty"?undefined:evalNode(a.value,env)}));
  return def.f(args,env,name);
}
// match args by name, then position
function A(args,params){
  const out={},used=new Set(),rest=[];
  args.forEach((a,i)=>{if(a.name!==null){const p=params.find(p=>p===a.name)||params.find(p=>p.startsWith(a.name)&&a.name.length>1);if(p){out[p]=a.value;used.add(i)}else rest.push(a)}});
  let pi=0;args.forEach((a,i)=>{if(used.has(i)||a.name!==null)return;while(pi<params.length&&(params[pi] in out||params[pi]==="..."))pi++;if(pi<params.length)out[params[pi++]]=a.value;else rest.push(a)});
  out["..."]=rest;return out;
}

const num=(v,d)=>v===undefined?d:+sc(v);
const str=(v,d)=>v===undefined?d:String(sc(v));

function fmtNum(x){if(x===null||x===undefined||Number.isNaN(x))return "NA";if(x===Infinity)return "Inf";if(x===-Infinity)return "-Inf";if(Number.isInteger(x)&&Math.abs(x)<1e15)return String(x);const s=String(+x.toPrecision(7));return s.includes("e")?x.toExponential(4).replace("e+","e+0"):s}
function fmtEl(x,quote=true){if(x===null||x===undefined)return "NA";if(typeof x==="boolean")return x?"TRUE":"FALSE";if(typeof x==="number")return fmtNum(x);return quote?'"'+x+'"':x}
function printVec(v,quote=true){
  if(!v.length)return typeOf(v)==="character"?"character(0)":"numeric(0)";
  const els=v.map(x=>fmtEl(x,quote));
  if(v.names){const w=v.map((x,i)=>Math.max(els[i].length,String(v.names[i]).length));const lines=[];let a=[],b=[],len=0;
    v.forEach((x,i)=>{if(len+w[i]+1>72&&a.length){lines.push(a.join(" ")+"\n"+b.join(" "));a=[];b=[];len=0}a.push(String(v.names[i]).padStart(w[i]));b.push(els[i].padStart(w[i]));len+=w[i]+1});
    lines.push(a.join(" ")+" \n"+b.join(" ")+" ");return lines.join("\n")}
  const w=Math.max(...els.map(e=>e.length));const lab=`[${v.length}]`.length;const per=Math.max(1,Math.floor((74-lab)/(w+1)));const lines=[];
  for(let i=0;i<els.length;i+=per){lines.push(`[${i+1}]`.padStart(lab)+" "+els.slice(i,i+per).map(e=>typeof v[0]==="string"?e.padEnd(w):e.padStart(w)).join(" "))}
  return lines.join("\n");
}
function geomWKT(g,t){const p=c=>Math.round(c[0])+" "+Math.round(c[1]);
  if(t==="POINT")return "POINT ("+p(g)+")";
  const pts=g.slice(0,2).map(p).join(", ")+(g.length>2?", ...":"");
  return t==="LINESTRING"?"LINESTRING ("+pts+")":"POLYGON (("+pts+"))"}
function bbox(d){let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;const add=c=>{x0=Math.min(x0,c[0]);x1=Math.max(x1,c[0]);y0=Math.min(y0,c[1]);y1=Math.max(y1,c[1])};
  if(isR(d))return [d.xmin,d.ymax-d.ny*d.res,d.xmin+d.nx*d.res,d.ymax];
  const gs=d.geom||[];gs.forEach(g=>{if(d.geomType==="POINT")add(g);else g.forEach(add)});return [x0,y0,x1,y1]}
function printDF(d,nmax=10){
  const lines=[];
  if(d.tibble&&!d.geom){const show=Math.min(d.nrow,nmax);const cols=d.names;const ty=cols.map(c=>{const t=typeOf(d.cols[c]);return t==="character"?"<chr>":t==="logical"?"<lgl>":"<dbl>"});
    const data=cols.map(c=>d.cols[c].slice(0,show).map(x=>fmtEl(x,false)));const rw=String(show).length;const w=cols.map((c,j)=>Math.max(c.length,ty[j].length,...data[j].map(s=>s.length)));
    lines.push(`# A tibble: ${d.nrow} × ${cols.length}`);let start=0;const shown=[];while(start<cols.length){let end=start,tot=rw+1;while(end<cols.length&&(tot+w[end]+1<=100||end===start)){tot+=w[end]+1;end++}shown.push([start,end]);if(start===0&&end<cols.length){break}start=end}
    const [s0,e0]=shown[0];lines.push(" ".repeat(rw+1)+cols.slice(s0,e0).map((c,j)=>ty[s0+j]==="<dbl>"?c.padStart(w[s0+j]):c.padEnd(w[s0+j])).join(" "));lines.push(" ".repeat(rw+1)+ty.slice(s0,e0).map((c,j)=>ty[s0+j]==="<dbl>"?c.padStart(w[s0+j]):c.padEnd(w[s0+j])).join(" "));
    for(let i=0;i<show;i++)lines.push(String(i+1).padStart(rw)+" "+data.slice(s0,e0).map((col,j)=>(typeof d.cols[cols[s0+j]][i]==="number"?col[i].padStart(w[s0+j]):col[i].padEnd(w[s0+j]))).join(" "));
    const more=[];if(show<d.nrow)more.push(`${d.nrow-show} more rows`);if(e0<cols.length)more.push(`${cols.length-e0} more variables: ${cols.slice(e0).join(", ")}`);if(more.length)lines.push("# ℹ "+more.join("\n# ℹ "));return lines.join("\n")}
  if(d.geom){const bb=bbox(d);lines.push(`Simple feature collection with ${d.nrow} feature${d.nrow===1?"":"s"} and ${d.names.length} field${d.names.length===1?"":"s"}`,`Geometry type: ${d.geomType}`,"Dimension:     XY",`Bounding box:  xmin: ${Math.round(bb[0])} ymin: ${Math.round(bb[1])} xmax: ${Math.round(bb[2])} ymax: ${Math.round(bb[3])}`,`Projected CRS: ${d.crs?d.crs.name:"NA"}`);
    if(d.nrow>nmax)lines.push(`First ${nmax} features:`)}
  const show=Math.min(d.nrow,d.nrow>20?nmax:d.nrow);
  const cols=d.names.slice();const data=cols.map(c=>d.cols[c].slice(0,show).map(x=>fmtEl(x,false)));
  if(d.geom){cols.push("geometry");data.push(d.geom.slice(0,show).map(g=>geomWKT(g,d.geomType)))}
  const rn=d.rownames?d.rownames.slice(0,show):[...Array(show).keys()].map(i=>String(i+1));const rw=Math.max(1,...rn.map(s=>s.length));
  const w=cols.map((c,j)=>Math.max(c.length,...data[j].map(s=>s.length)));

  let start=0;while(start<cols.length){let end=start,tot=rw;while(end<cols.length&&(tot+w[end]+1<=118||end===start)){tot+=w[end]+1;end++}
    lines.push(" ".repeat(rw)+" "+cols.slice(start,end).map((c,j)=>c.padStart(w[start+j])).join(" "));
    for(let i=0;i<show;i++)lines.push(rn[i].padEnd(rw)+" "+data.slice(start,end).map((col,j)=>col[i].padStart(w[start+j])).join(" "));start=end}
  if(show<d.nrow)lines.push(`# … with ${d.nrow-show} more rows  (use head(x, n = …) or View(x))`);
  if(d.nrow===0)lines.push("<0 rows>");
  return lines.join("\n");
}
function rstats(r){let mn=Infinity,mx=-Infinity,s=0,n=0;for(const x of r.data){if(Number.isNaN(x))continue;if(x<mn)mn=x;if(x>mx)mx=x;s+=x;n++}return {mn,mx,s,n}}

  return ["class       : SpatRaster ",`dimensions  : ${r.ny}, ${r.nx}, 1  (nrow, ncol, nlyr)`,`resolution  : ${r.res}, ${r.res}  (x, y)`,`extent      : ${bb[0]}, ${bb[2]}, ${bb[1]}, ${bb[3]}  (xmin, xmax, ymin, ymax)`,
    `coord. ref. : ${CRS.name} (EPSG:${CRS.epsg}) `,`source      : ${r.file||"memory"} `,`name        : ${r.name} `,`min value   : ${r.logical?"FALSE":fmtNum(+st.mn.toFixed(3))} `,`max value   : ${r.logical?"TRUE":fmtNum(+st.mx.toFixed(3))} `].join("\n")}
function printList(l,prefix=""){const out=[];l.names.forEach((n,i)=>{const p=prefix+"$"+(/^[A-Za-z.][A-Za-z0-9._]*$/.test(n)?n:"`"+n+"`");const v=l.vals[i];

function fmtValue(v){
  if(v===null||v===undefined)return "NULL";
  if(isVec(v))return printVec(v);
  if(isDF(v))return printDF(v);
  if(isR(v))return printRast(v);
  if(isList(v))return printList(v);
  if(v.type==="fn")return `function (...) \n<environment: namespace:${v.def.pkg}>`;
  if(v.type==="sfc")return `Geometry set for ${v.geom.length} features\nGeometry type: ${v.geomType}\n`+v.geom.slice(0,5).map(g=>geomWKT(g,v.geomType)).join("\n");
  if(v.type==="httr2_request")return `<httr2_request>\nGET ${fullUrl(v)}\nHeaders:\n`+(Object.keys(v.headers).map(k=>`• ${k}: '<REDACTED>'`).join("\n")||"")+"\nBody: empty";
  if(v.type==="httr2_response")return `<httr2_response>\nGET ${v.url}\nStatus: ${v.status} ${v.statusText}\nContent-Type: application/json\nBody: In memory (${v.bytes} bytes)`;
  if(v.type==="sgbp")return `Sparse geometry binary predicate list of length ${v.list.length}, where the predicate was \`intersects'\n`+v.list.slice(0,6).map((x,i)=>` ${i+1}: ${x.length?x.map(k=>k+1).join(", "):"(empty)"}`).join("\n");

  if(v.type==="formula")return "~formula";
  return "<"+v.type+">";
}

function needFile(f){
  if(!(f in FILES)){const close=Object.keys(FILES).find(k=>k.toLowerCase().includes(f.toLowerCase().split(/[._]/)[0]));
    throw new RError(`cannot open file '${f}': No such file or directory`,{tip:(close?`Did you mean "${close}"? `:"")+"Check the Files tab for exact names — spelling and extension must match."})}
  if(FILES[f].xlsx)throw new RError(`'${f}' is an Excel workbook`,{tip:`Read it with readxl:  read_excel("${f}", sheet = "sheet_name"). List its sheets with excel_sheets("${f}").`});
  return {load:()=>{const o=FILES[f].load();o.src=f;return o}};
}

def("global","terra",(a)=>{const p=A(a,["x","fun","na.rm"]);const r=p.x;if(!isR(r))throw new RError("global() needs a SpatRaster",{tip:"For data frame columns use sum(df$col)."});

  emit("global",{r,fun,value:v,rm});if(hasNA&&!rm)R.warn("Cells outside the district are NA → result is NA. Add  na.rm = TRUE");
  const d={type:"df",names:[fun],cols:{[fun]:[v===null?null:(fun==="sum"?Math.round(v):+v.toFixed(4))]},nrow:1,geom:null,rownames:[r.name]};return d});

def("extract","terra",(a)=>{const p=A(a,["x","y","fun","na.rm","ID"]);const r=p.x,v=p.y;
  if(!isR(r))throw new RError("extract(): first argument must be a SpatRaster (e.g. pop)");if(!isSF(v))throw new RError("extract(): second argument must be sf polygons or points",{tip:"Buffers from st_buffer() are perfect here."});
  const fn=p.fun&&p.fun.type==="fn"?p.fun.name:p.fun?str(p.fun):null;const out=[];
  v.geom.forEach(g=>{
    if(v.geomType==="POINT"){const c=Math.floor((g[0]-r.xmin)/r.res),rw=Math.floor((r.ymax-g[1])/r.res);const x=r.data[rw*r.nx+c];out.push(Number.isNaN(x)?null:x);return}
    if(v.geomType!=="POLYGON")throw new RError("extract() with lines is not supported here");
    const bb=[Infinity,Infinity,-Infinity,-Infinity];g.forEach(q=>{bb[0]=Math.min(bb[0],q[0]);bb[1]=Math.min(bb[1],q[1]);bb[2]=Math.max(bb[2],q[0]);bb[3]=Math.max(bb[3],q[1])});
    let s=0,n=0,m=-Infinity;const c0=Math.max(0,Math.floor((bb[0]-r.xmin)/r.res)),c1=Math.min(r.nx-1,Math.floor((bb[2]-r.xmin)/r.res)),r0=Math.max(0,Math.floor((r.ymax-bb[3])/r.res)),r1=Math.min(r.ny-1,Math.floor((r.ymax-bb[1])/r.res));
    for(let rr=r0;rr<=r1;rr++)for(let cc=c0;cc<=c1;cc++){const x=r.xmin+(cc+.5)*r.res,y=r.ymax-(rr+.5)*r.res;if(!pointInPoly(x,y,g))continue;const val=r.data[rr*r.nx+cc];if(Number.isNaN(val))continue;s+=val;n++;m=Math.max(m,val)}

});

def("st_as_sf","sf",(a)=>{const p=A(a,["x","coords","crs"]);const d=p.x;if(!isDF(d))throw new RError("st_as_sf() needs a data frame");if(isSF(d))return d;

  const crs=p.crs===undefined?null:sc(p.crs);if(crs===null)R.warn("No crs given — your points have no coordinate reference system. Use crs = 32735");

function resolveAes(layer,shape,{fillKey,defaultFill}){
  const o=layer.o;const key=fillKey.map(k=>o[k]).find(v=>v!==undefined);
  const palSpec=o.palette??o["fill.scale"]??o["col.scale"];const legendT=(o["fill.legend"]||o["col.legend"])?.title??(o.title!==undefined?str(o.title):undefined);
  const alpha=num(o.alpha??o.fill_alpha??o.col_alpha,1);
  if(key===undefined)return {constant:defaultFill,alpha};
  const v0=vec(key);
  if(v0.length===1&&typeof v0[0]==="string"&&isDF(shape)&&shape.names.includes(v0[0])){
    const colname=v0[0];const v=shape.cols[colname];
    if(typeOf(v)==="numeric"){const n=nums(v);const br=prettyBreaks(Math.min(...n),Math.max(...n),5);const pal=palette(palSpec)||PAL.ylorbr;const k=br.length-1;const cols=[...Array(k).keys()].map(i=>`rgb(${ramp(pal,k===1?1:i/(k-1))})`);
      return {byIndex:i=>{if(v[i]===null)return "#bbb";let j=br.findIndex((b,jj)=>jj<k&&v[i]>=b&&v[i]<=br[jj+1]);return cols[Math.max(0,j)]},legend:{title:legendT??colname,labels:cols.map((_,i)=>`${fmtK(br[i])} to ${fmtK(br[i+1])}`),cols},alpha,varname:colname}}
    const labels=[...new Set(v.map(x=>fmtEl(x,false)))].sort();const pal=palette(palSpec);const cols=labels.map((_,i)=>pal?(pal.length>=labels.length?pal[i]:`rgb(${ramp(pal,labels.length===1?1:i/(labels.length-1))})`):CAT[i%CAT.length]);
    return {byIndex:i=>cols[labels.indexOf(fmtEl(v[i],false))],legend:{title:legendT??colname,labels,cols},alpha,varname:colname};
  }
  if(v0.length===1&&typeof v0[0]==="string"){const c=rcol(v0[0]);if(!c){if(isDF(shape))throw new RError(`'${v0[0]}' is neither a column of this shape nor a colour`,{tip:"Columns: "+shape.names.join(", ")});throw new RError("unknown colour '"+v0[0]+"'")}return {constant:c,alpha,legendTitle:legendT}}
  throw new RError("colour arguments take a column name (in quotes) or a colour");
}
function renderTmap(tm,ctx,W,H){
  if(!tm.groups.length)throw new RError("this tmap has no tm_shape() — nothing to draw");
  Plot.blank(ctx,W,H);const k=W/900;ctx.save();ctx.scale(k,k);
  const master=tm.groups[0].shape;const bb=isR(master)?Plot.pad(rTrim(master),.03):Plot.pad(bbox(master),.06);
  const F=Plot.frame(bb,{x:24,y:tm.extras.title?60:24,w:630,h:tm.extras.title?560:596});
  ctx.save();ctx.beginPath();ctx.rect(...F.box);ctx.clip();
  const legends=[];const info={layers:[]};
  tm.groups.forEach(g=>{const s=g.shape;if(!g.layers.length)R.warn("tm_shape() without a layer draws nothing — add e.g. + tm_dots()");
    g.layers.forEach(L=>{
      const kind=L.kind;info.layers.push({kind,shape:s});
      if(kind==="raster"){if(!isR(s))throw new RError("tm_raster() needs a raster in tm_shape()",{tip:"For sf objects use tm_polygons(), tm_lines() or tm_dots()."});
        const st=rstats(s);const pal=palette(L.o.palette??L.o["col.scale"])||(s.logical?["#eeeeee","#1a9850"]:PAL.ylorbr);const lg=(L.o["col.legend"]||{}).title??(L.o.title!==undefined?str(L.o.title):s.name);const alpha=num(L.o.alpha??L.o.col_alpha,1);
        if(s.logical){const c0=hexRGB(pal[0]),c1=hexRGB(pal[pal.length-1]);Plot.drawRaster(ctx,s,F,v=>[...(v?c1:c0),Math.round(alpha*255)]);legends.push({title:lg,labels:["FALSE","TRUE"],cols:[pal[0],pal[pal.length-1]],kind:"box"})}
        else{const br=prettyBreaks(st.mn,st.mx,5);const n=br.length-1;const cols=[...Array(n).keys()].map(i=>ramp(pal,n===1?1:i/(n-1)));
          Plot.drawRaster(ctx,s,F,v=>{let j=0;while(j<n-1&&v>br[j+1])j++;return [...cols[j],Math.round(alpha*255)]});legends.push({title:lg,labels:cols.map((_,i)=>`${fmtK(br[i])} to ${fmtK(br[i+1])}`),cols:cols.map(c=>`rgb(${c})`),kind:"box"})}
        return}
      if(!isSF(s))throw new RError(`tm_${kind}() needs an sf object in tm_shape(), not a raster`,{tip:"Rasters use tm_raster()."});
      if(kind==="lines"&&s.geomType!=="LINESTRING")throw new RError("tm_lines() needs line geometries (roads)");
      if((kind==="polygons"||kind==="borders")&&s.geomType!=="POLYGON")throw new RError(`tm_${kind}() needs polygons — for points use tm_dots()`);
      if(kind==="text"){const col=str(L.o.text);if(!s.names.includes(col))throw new RError("tm_text(): column '"+col+"' not found");ctx.fillStyle=rcol(str(L.o.col,"black"))||"#000";ctx.font=`600 ${Math.round(11*num(L.o.size,1))}px sans-serif`;ctx.textAlign="center";ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=3;
        s.geom.forEach((g,i)=>{const c=s.geomType==="POINT"?g:[g.reduce((a,p)=>a+p[0],0)/g.length,g.reduce((a,p)=>a+p[1],0)/g.length];const t=fmtEl(s.cols[col][i],false);const y=F.Y(c[1])+num(L.o.ymod,-1.2)*12;ctx.strokeText(t,F.X(c[0]),y);ctx.fillText(t,F.X(c[0]),y)});return}
      const fillKey=kind==="lines"?["col","fill"]:kind==="borders"?["col"]:["fill","col"];
      const def0=kind==="lines"?"#555":kind==="borders"?"#333":kind==="dots"?"#222":"#d9d9d9";
      const aes=resolveAes(L,s,{fillKey,defaultFill:def0});
      const border=kind==="dots"||kind==="polygons"?(rcol(str(kind==="polygons"?(L.o["border.col"]??(L.o.fill!==undefined?L.o.col:undefined)):L.o["border.col"]??undefined,"#333"))||"#333"):null;
      const size=num(L.o.size,kind==="dots"?0.6:1);const lwd=num(L.o.lwd,kind==="lines"?2:1);
      s.geom.forEach((g,i)=>{const fill=aes.constant??aes.byIndex(i);
        if(kind==="borders")Plot.drawGeom(ctx,g,"POLYGON",F,{fill:null,col:fill,lwd});
        else if(kind==="lines")Plot.drawGeom(ctx,g,"LINESTRING",F,{fill,lwd});
        else Plot.drawGeom(ctx,g,s.geomType,F,{fill,col:kind==="dots"?"#1a1a1a":border,alpha:aes.alpha,size:3+size*7,lwd:1})});
      if(aes.legend)legends.push({...aes.legend,kind:kind==="dots"?"dot":kind==="lines"?"line":"box"});
    })});
  ctx.restore();ctx.strokeStyle="#444";ctx.lineWidth=1;ctx.strokeRect(...F.box);
  // extras
  const e=tm.extras;
  if(e.title){ctx.fillStyle="#111";ctx.font="800 20px Chivo, sans-serif";ctx.textAlign="left";ctx.fillText(e.title,24,38)}
  if(e.compass){const x=F.box[0]+F.box[2]-34,y=F.box[1]+16;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y+22,20,0,7);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.moveTo(x,y+4);ctx.lineTo(x+9,y+32);ctx.lineTo(x,y+26);ctx.lineTo(x-9,y+32);ctx.closePath();ctx.fill();ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.fillText("N",x,y+48)}
  if(e.scalebar){const km=[1,2,5,10,20].find(v=>v*1000*F.s>90)||20;const px=km*1000*F.s;const x=F.box[0]+14,y=F.box[1]+F.box[3]-22;ctx.fillStyle="rgba(255,255,255,.8)";ctx.fillRect(x-6,y-16,px+44,30);for(let i=0;i<4;i++){ctx.fillStyle=i%2?"#fff":"#222";ctx.fillRect(x+i*px/4,y,px/4,6)}ctx.strokeStyle="#222";ctx.strokeRect(x,y,px,6);ctx.fillStyle="#222";ctx.font="11px sans-serif";ctx.textAlign="center";ctx.fillText("0",x,y-4);ctx.fillText(km+" km",x+px,y-4)}
  if(e.credits){ctx.fillStyle="#555";ctx.font="10.5px sans-serif";ctx.textAlign="right";ctx.fillText(e.credits,F.box[0]+F.box[2]-6,F.box[1]+F.box[3]+16)}
  let ly=F.box[1]+4;legends.forEach(l=>{if(ly>600)return;ly=Plot.legendCat(ctx,F.box[0]+F.box[2]+22,ly+12,l.labels.slice(0,8),l.cols.slice(0,8),l.title,l.kind)});
  ctx.restore();
  info.extras=e;info.legends=legends.length;return info;
}
function mapChecklist(info){
  const has=(kind,test)=>info.layers.some(l=>(!kind||kind.includes(l.kind))&&test(l.shape));
  return [
    {key:"risk",label:"Risk or population layer",on:has(["raster"],s=>true)||has(["polygons"],s=>s.src==="grid3_settlement_extents.geojson")},
    {key:"roads",label:"OSM roads",on:has(["lines"],s=>s.src==="osm_roads.geojson")},
    {key:"cases",label:"Cases",on:has(["dots"],s=>s.src===LL_SRC)},
    {key:"hubs",label:"3 vaccination hubs",on:has(["dots","text"],s=>s.src==="grid3_health_facilities.geojson"&&s.nrow===3)},
    {key:"title",label:"Title",on:!!info.extras.title},
    {key:"legend",label:"Legend",on:info.legends>0},
    {key:"nav",label:"Compass + scale bar",on:!!(info.extras.compass&&info.extras.scalebar)},
  ];
}
R.lastMap=null;
function showTmap(tm){const info=renderTmap(tm,Plot.ctx,900,640);Plot.title("tmap");const cl=mapChecklist(info);Plot.showCheck(cl);R.lastMap={tm,info,cl};emit("tmap",{info,cl})}
def("tmap_save","tmap",(a)=>{const p=A(a,["tm","filename","width","height","dpi"]);const tm=p.tm;if(!tm||tm.type!=="tmap")throw new RError("tmap_save(): first argument must be a tmap object",{tip:"Store your map first:  yf_map <- tm_shape(...) + ...  then  tmap_save(yf_map, \"yf_hubs.png\")"});
  const fn=str(p.filename,"tmap.png");if(!/\.png$/i.test(fn))throw new RError("In this lab tmap_save() writes .png files — end the filename with .png");
  const c=document.createElement("canvas");c.width=1800;c.height=1280;const info=renderTmap(tm,c.getContext("2d"),1800,1280);const cl=mapChecklist(info);
  showTmap(tm);R.msg(`Map saved to ${fn}\nResolution: 1800 by 1280 pixels\nSize: 6 by 4.27 inches (300 dpi)`);emit("tmap_save",{fn,canvas:c,cl});return inv(null)});

function isBreeding(v){return isR(v)&&v.logical&&(v.srcs||[]).includes("gee_ndvi_last30d.tif")&&(v.srcs||[]).includes("gee_precip_last30d_mm.tif")&&(()=>{let t=0,n=0;for(const x of v.data){if(Number.isNaN(x))continue;n++;t+=x}const pct=100*t/n;return Math.abs(pct-TRUTH.breedPct)<3})()}
function mapOK(keys){return !!(R.lastMap&&keys.every(k=>R.lastMap.cl.find(c=>c.key===k).on))}

// ---- event hooks -> flags ----
R.hooks.push((ev,d)=>{
  const F=S.flags;
  if(ev==="sheets")F.sheets=true;
  if(ev==="readsheet")award("excel");
  if(ev==="global"){if(d.r.src==="worldpop_kivara_2020_200m.tif"&&!d.r.srcs&&d.fun==="sum"&&d.value!==null&&!d.r.logical)F.popTotal=d.value;if(d.r.src==="worldpop_kivara_u5_2020_200m.tif"&&d.fun==="sum"&&d.value!==null)F.u5Total=d.value}
  if(ev==="plot"){const x=d.x;if(isR(x)&&x.src==="worldpop_kivara_2020_200m.tif"&&!x.logical)F.plotPop=true;if(isSF(x)&&x.src===LL_SRC)F.plotCases=true;if(isR(x)&&isBreeding(x))F.plotBreeding=true}
  if(ev==="buffer"&&d.dist>=4000&&d.dist<=6000)F.buffer5=true;
  if(ev==="tmap_save"){F.saved=true;S.savedCanvas=d.canvas;S.savedName=d.fn;if(d.cl.every(c=>c.on))award("cartographer")}
  if(ev==="tmap"){const e=d.info.extras;if(e.credits&&/openstreetmap/i.test(e.credits))award("credits")}
  if(ev==="assign"&&isFac(d.value)&&d.value.nrow===3&&d.value.cols.cold_chain.every(x=>x==="yes")){award("cold");const near=d.value.geom.some(g=>DATA.cases.filter(c=>Math.hypot(c.x_utm-g[0],c.y_utm-g[1])<=5000).length>=10);if(near)award("cases")}
});
// ===================== Reveal answers + catch-up (nobody gets stuck) =====================
// What goes in each ___ blank, per mission and task
const FILLS={M2:[[XL],["weekly_counts"],["Lomera"]],M3:[["worldpop_kivara_2020_200m.tif"],[],["TRUE"],[]],M4:[["linelist"],["32735"],[]],
  M5:[[],["gee_precip_last30d_mm.tif"],["0.6","100"],[]],M6:[[],["5000"],[],["yes"]],M7:[[],["hubs"],["Kivara YF response: proposed vaccination hubs"],[]]};
const ANS_FILLS={M2:["confirmed"],M4:["classification"]};
const ANS_VALUE={M2:()=>TRUTH.lomera,M3:()=>TRUTH.pop,M4:()=>TRUTH.confirmed,M5:()=>+TRUTH.breedPct.toFixed(1)};
// Objects each mission leaves in the Environment (used to rebuild after a reload or a jump)
const PROVIDES={M1:[],M2:["weekly","lomera"],M3:["pop","u5"],M4:["cases","cases_sf"],M5:["ndvi","rain","breeding"],M6:["fac","catch","hubs"],M7:["roads","yf_map"]};
MISSIONS.forEach(m=>{
  m.tasks.forEach((t,k)=>{let c=t.tpl||"";((FILLS[m.code]||[])[k]||[]).forEach(v=>{c=c.replace("___",v)});t.full=c});
  if(m.answer){let c=m.answer.tpl||(m.code==="M3"?`global(pop, "sum", na.rm = TRUE)`:"");(ANS_FILLS[m.code]||[]).forEach(v=>{c=c.replace("___",v)});m.answer.full=c}
});
S.revealed=S.revealed||{};S.stats=S.stats||{runs:0,errors:0,streak:0,lastError:"",lastCode:"",lastProgressAt:0};
let MUTE=false;
function missionBuilt(j){const m=MISSIONS[j];if(m.code==="M1")return ["readxl","dplyr","terra","sf","tmap"].every(p=>R.loaded.has(p));return PROVIDES[m.code].every(n=>R.global.has(n))}
// Quietly re-run the model solution of every earlier mission whose objects are missing
function catchUp(upto,{announce=true}={}){
  const rebuilt=[];
  for(let j=0;j<upto;j++){if(missionBuilt(j))continue;MUTE=true;try{runSource(MISSIONS[j].sol,{echo:false,stats:false})}finally{MUTE=false}rebuilt.push(MISSIONS[j].code)}
  if(rebuilt.length&&announce)out(`✔ Caught up: rebuilt the objects from ${rebuilt.join(", ")} using the model answers. You can carry on from here.`,"ok");
  renderEnv();return rebuilt;
}
function revealTask(k,depth=0){
  const m=MISSIONS[S.mi];catchUp(S.mi);
  m.tasks.forEach((t,i)=>{if(i<k&&!S.done[S.mi+"t"+i]&&t.full){S.revealed[S.mi+"t"+i]=true;MUTE=true;try{runSource(t.full,{echo:false,stats:false})}finally{MUTE=false}}});
  const t=m.tasks[k];S.revealed[S.mi+"t"+k]=true;
  appendSrc(`# revealed: ${t.t.replace(/<[^>]+>/g,"")}\n${t.full}`);
  out("── Revealed answer (read it, then compare with what you tried) ──","ok");
  runSource(t.full,{stats:false});
  if(!S.done[S.mi+"t"+k]){const pending=m.tasks.findIndex((x,i)=>!S.done[S.mi+"t"+i]);if(pending>=0&&pending!==k&&depth<3)revealTask(pending,depth+1)}
}
function revealAnswer(){
  const m=MISSIONS[S.mi];catchUp(S.mi);
  m.tasks.forEach((t,i)=>{if(!S.done[S.mi+"t"+i]&&t.full){S.revealed[S.mi+"t"+i]=true;MUTE=true;try{runSource(t.full,{echo:false,stats:false})}finally{MUTE=false}}});
  if(m.answer.full){appendSrc(`# revealed: ${m.answer.label}\n${m.answer.full}`);runSource(m.answer.full,{stats:false})}
  const v=ANS_VALUE[m.code]();S.answered[S.mi]=String(v)+" (revealed)";S.revealed[S.mi+"ans"]=true;
  out(`→ ${m.answer.label}: ${v}`,"ok");checkMission();renderRight();save();
}
function revealQuiz(){const q=S.quiz[S.mi]=S.quiz[S.mi]||{wrong:[]};q.right=true;q.revealed=true;renderRight();save()}
function jumpTo(i){if(i===S.mi)return;catchUp(i);if(!S.started)S.started=true;startMission(i)}
// ===================== UI: console, editor, panels =====================
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const conOut=$("conOut");
function out(text,cls=""){if(typeof MUTE!=="undefined"&&MUTE&&cls!=="err")return;const d=document.createElement("div");if(cls)d.className=cls;d.textContent=text;conOut.appendChild(d);const c=$("console");c.scrollTop=c.scrollHeight}
R.print=t=>out(t);R.msg=t=>out(t,"msg");R.warn=t=>out("Warning message:\n"+t,"warn");
R.show=v=>{if(v&&v.type==="tmap"){showTmap(v);return}out(fmtValue(v))};

const RANKS=[[0,"Intern"],[150,"Data Analyst"],[350,"Epi Intel Officer"],[600,"Incident GIS Lead"],[850,"Chief Data Strategist"]];
const rankOf=xp=>RANKS.filter(r=>xp>=r[0]).pop()[1];
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function addXP(n,why){S.xp=Math.max(0,S.xp+n);const old=$("rank").textContent;$("xp").textContent=S.xp;const r=rankOf(S.xp);$("rank").textContent=r;if(n>0&&why)toast(`+${n} XP · ${why}`);if(r!==old&&n>0)setTimeout(()=>toast("Promoted: "+r),900);save()}
function award(k){if(S.badges[k])return;S.badges[k]=true;addXP(25,"Badge: "+BADGES[k])}
function tick(min){S.minutes=Math.max(0,S.minutes-min);const h=Math.floor(S.minutes/60),m=S.minutes%60;$("clock").textContent=`${h}h ${String(m).padStart(2,"0")}m`}

// ---- run code ----
let pending="";
function runSource(src,{echo=true,stats=true}={}){
  const ST=S.stats;if(stats){ST.runs++;ST.lastCode=src.trim().slice(0,160)}
  const fail=msg=>{if(stats){ST.errors++;ST.streak++;ST.lastError=msg.slice(0,200)}};
  if(/___/.test(src)){const line=src.split("\n").find(l=>l.includes("___"));if(echo)out("> "+line.trim(),"in");out("Error: there's still a blank ___ to fill in","err");fail("blank ___ not filled");out("Hint: Replace ___ with your answer. Look at the comment after # on that line, the Files tab, or the mission text. Then run it again.","msg");after();return false}
  let stmts;
  try{stmts=parseR(src)}catch(e){
    if(echo)src.split("\n").forEach((l,i)=>out((i?"+ ":"> ")+l,"in"));
    out("Error: "+e.message,"err");if(e.tip)out("Hint: "+e.tip,"msg");fail(e.message);tick(15);after();return false}
  for(const s of stmts){
    if(echo)s.text.split("\n").forEach((l,i)=>out((i?"+ ":"> ")+l,"in"));
    try{const v=evalNode(s.node,R.global);if(!(v&&v.invisible))R.show(v);tick(5)}
    catch(e){if(!(e instanceof RError))console.error(e);out("Error"+(s.node.k==="call"&&s.node.fn.v?` in ${s.node.fn.v}()`:"")+": "+e.message,"err");if(e.tip)out("Hint: "+e.tip,"msg");fail(e.message);tick(15);after();return false}
  }
  if(stats)ST.streak=0;
  after();return true;
}
function after(){renderEnv();checkMission();save()}

// ---- console input ----
const cin=$("cin");const hist=[];let hi=0;
cin.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();const line=cin.value;cin.value="";const src=pending?pending+"\n"+line:line;
    if(!src.trim()){out(">","in");return}
    try{parseR(src)}catch(err){if(err.incomplete){out((pending?"+ ":"> ")+line,"in");pending=src;$("cprompt").textContent="+";return}}
    if(pending)out("+ "+line,"in");else out("> "+line,"in");
    hist.push(src);hi=hist.length;pending="";$("cprompt").textContent=">";runSource(src,{echo:false})}
  else if(e.key==="ArrowUp"&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);cin.value=hist[hi]}
  else if(e.key==="ArrowDown"){e.preventDefault();hi=Math.min(hist.length,hi+1);cin.value=hist[hi]||""}
  else if(e.key==="Escape"){pending="";$("cprompt").textContent=">";cin.value="";out("> ","in")}
});
$("console").addEventListener("click",e=>{if(!window.getSelection().toString())cin.focus()});
$("clearCon").onclick=()=>{conOut.innerHTML=""};

// ---- editor ----
const src=$("src");
function gutter(){const n=src.value.split("\n").length;$("gutter").textContent=[...Array(n).keys()].map(i=>i+1).join("\n")}
src.addEventListener("input",()=>{gutter();save()});
src.addEventListener("scroll",()=>{$("gutter").scrollTop=src.scrollTop});
function runCurrent(){
  const a=src.selectionStart,b=src.selectionEnd,txt=src.value;
  if(b>a){runSource(txt.slice(a,b));return}
  let stmts=null;try{stmts=parseR(txt)}catch(e){}
  if(stmts){const s=stmts.find(s=>a>=s.start&&a<=s.end)||stmts.find(s=>s.start>=a);if(s){runSource(txt.slice(s.start,s.end));let nx=txt.indexOf("\n",s.end);nx=nx<0?txt.length:nx+1;src.selectionStart=src.selectionEnd=nx;return}}
  const ls=txt.lastIndexOf("\n",a-1)+1;let le=txt.indexOf("\n",a);if(le<0)le=txt.length;const line=txt.slice(ls,le);if(line.trim())runSource(line);src.selectionStart=src.selectionEnd=Math.min(txt.length,le+1);
}
src.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(e.shiftKey)runSource(src.value);else runCurrent()}
  if(e.key==="Tab"){e.preventDefault();const a=src.selectionStart;src.setRangeText("  ",a,src.selectionEnd,"end");gutter()}
  if(e.altKey&&e.key==="-"){e.preventDefault();src.setRangeText(" <- ",src.selectionStart,src.selectionEnd,"end")}
  if(e.ctrlKey&&e.shiftKey&&(e.key==="M"||e.key==="m")){e.preventDefault();src.setRangeText(" |> ",src.selectionStart,src.selectionEnd,"end")}
});
$("runLine").onclick=()=>{src.focus();runCurrent()};
$("runAll").onclick=()=>runSource(src.value);
$("clearSrc").onclick=()=>{src.value=HEADER;gutter();save()};
const HEADER=`# =====================================================
#  Kivara District · Yellow Fever response
#  Run a line: cursor on it, press Ctrl+Enter
#  Run everything: Ctrl+Shift+Enter
#  Shortcuts: Alt+-  gives  <-    Ctrl+Shift+M  gives  |>
# =====================================================
`;
function appendSrc(code){if(!src.value.endsWith("\n"))src.value+="\n";src.value+=code+"\n";gutter();src.scrollTop=src.scrollHeight;save()}

// ---- right-top panel ----
let tab="mission";
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));renderRight()});
function descObj(v){if(v===null)return "NULL";if(isVec(v))return `${typeOf(v).slice(0,3)} [1:${v.length}] ${v.slice(0,4).map(e=>fmtEl(e)).join(" ")}${v.length>4?" …":""}`;
  if(isSF(v))return `sf · ${v.nrow} × ${v.names.length+1} · ${v.geomType}`;if(isDF(v))return `${v.nrow} obs. of ${v.names.length} variables`;
  if(isR(v))return `SpatRaster ${v.ny}×${v.nx} · ${v.logical?"TRUE/FALSE":v.name}`;if(isList(v))return `List of ${v.vals.length}`;if(v.type==="tmap")return "tmap object — print it to draw";
  if(v.type==="httr2_response")return `<httr2_response> ${v.status} ${v.statusText}`;if(v.type==="httr2_request")return "<httr2_request>";if(v.type==="sgbp")return `sgbp list of ${v.list.length}`;return v.type}
function renderEnv(){if(tab==="env")renderRight()}
function renderRight(){
  const el=$("rightTop");
  if(tab==="env"){const vs=[...R.global.vars.entries()];el.innerHTML=vs.length?`<table class="env"><tbody>${vs.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(descObj(v))}</td></tr>`).join("")}</tbody></table>`:`<p class="empty">Global Environment is empty. Objects you create with <code>&lt;-</code> appear here.</p>`;return}
  if(tab==="files"){el.innerHTML=`<p class="empty" style="padding-bottom:0">~/kivara_yf · click the Excel file to preview its sheets; click any other file to add the line that reads it</p><table class="env files"><tbody>${Object.entries(FILES).map(([f,m])=>`<tr><td><button class="choice" data-file="${f}" style="font:600 12px var(--mono)">${f}</button></td><td>${esc(m.desc)} · ${m.size}</td></tr>`).join("")}</tbody></table>`;
    el.querySelectorAll("[data-file]").forEach(b=>b.onclick=()=>{const f=b.dataset.file;if(FILES[f].xlsx){previewXlsx(f);return}const v=f.replace(/\..*$/,"").replace(/^(worldpop_kivara_|grid3_|gee_|osm_|yf_)/,"").replace(/_2020.*|_last30d.*/,"");
      const code=f.endsWith(".tif")?`${v} <- rast("${f}")`:f.endsWith(".csv")?`${v} <- read.csv("${f}")`:`${v} <- st_read("${f}")`;appendSrc(code);toast("Inserted into script")});return}
  if(tab==="playbook"){renderPlaybook();return}
  renderMission();
}
function renderPlaybook(){
  const el=$("rightTop");
  el.innerHTML=`<div class="pb"><div><h2>Reuse this workflow in any project</h2><p class="brief" style="margin-top:4px">Every mission was one step of the same six-step recipe. Swap in your own files, thresholds and question: cholera, malaria, measles, PMTCT, access to care.</p></div>
  ${PLAYBOOK.map(s=>`<div class="pbstep"><span class="pbn">${s.n}</span><div><b>${s.title}</b> · ${s.what}<pre>${esc(s.code)}</pre></div></div>`).join("")}
  <div><b>What to swap for other diseases</b><div class="swap"><table><thead><tr><th>Project</th><th>Risk layer (step 4)</th><th>Who / what to count (step 5)</th><th>Catchment</th></tr></thead><tbody>${SWAPS.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
  <div class="reuse"><b>Checklist for a new project</b>1. Put each source in one folder: Excel/CSV tables, .tif rasters, .geojson/.shp shapes. · 2. In Excel: one table per sheet, headers in row 1, no merged cells. · 3. Know your coordinates: degrees → 4326, metres → your UTM code. · 4. Save the script and re-run it when new data arrive.</div>
  <div class="mfoot"><button class="btn primary" id="pbCopy">Copy template script</button><button class="btn" id="pbSave">Save template (.txt)</button><button class="btn" id="pbInsert">Open template in editor</button><button class="btn" id="mySave">Save my script (.txt)</button><span id="pbNote" style="font-size:12px;color:var(--muted)"></span></div></div>`;
  $("pbCopy").onclick=async()=>{try{await navigator.clipboard.writeText(playbookScript());$("pbNote").textContent="Copied. Paste it into RStudio."}catch(e){$("pbNote").textContent="Copy blocked here. Use 'Open template in editor' and select all."}};
  $("pbSave").onclick=()=>saveText("open_data_workflow_template.R.txt",playbookScript(),"pbNote");
  $("mySave").onclick=()=>saveText("my_kivara_script.R.txt",src.value,"pbNote");
  $("pbInsert").onclick=()=>{appendSrc("\n"+playbookScript());toast("Template added to the end of your script")};
}
async function saveText(name,text,noteId){const note=$(noteId);try{await getDL();if(!dl){note.textContent="Saving isn't available here. Use Copy instead.";return}await dl.save({filename:name,data:text});note.textContent="Saved. Rename it to .R to open it in RStudio."}catch(e){note.textContent=e&&e.code==="declined"?"Save cancelled.":"Couldn't save here. Use Copy instead."}}
function steps(){$("steps").innerHTML=MISSIONS.map((m,i)=>`<button class="step ${S.done[i]?"done":i===S.mi?"cur":""}" data-jump="${i}" title="Go to ${m.code}: ${m.title} (earlier missions are rebuilt automatically)" aria-label="Go to ${m.code}"></button>`).join("");$("steps").querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{tab="mission";document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab==="mission"));jumpTo(+b.dataset.jump)})}
function renderMission(){
  const el=$("rightTop");const m=MISSIONS[S.mi];if(!m){return}
  const tasks=m.tasks.map((t,i)=>({...t,ok:!!S.done[S.mi+"t"+i]}));
  const qz=S.quiz[S.mi]||{};const ans=S.answered[S.mi];
  const firstOpen=tasks.findIndex(t=>!t.ok);
  el.innerHTML=`<div class="mission">
    <div class="mhead"><span class="mnum">${m.code} / M${MISSIONS.length}</span><div><h2>${m.title}</h2><div class="src">${m.src} · Playbook step ${m.step}</div></div></div>
    <p class="brief">${m.brief}</p>
    <ul class="tasks">${tasks.map((t,i)=>`<li class="task ${t.ok?"done":""}"><span class="box">${t.ok?"✓":i+1}</span><span class="t">${t.t}${t.why?`<span class="why">${t.why}</span>`:""}${!t.ok?`<span class="stepbtns">${t.tpl?`<button class="tplbtn" data-tpl="${i}" title="Adds a starter line to your script. Fill in any ___ then press Run.">${i===firstOpen?"▸ ":""}Starter code</button>`:""}<button class="revbtn" data-rev="${i}" title="Adds the finished code to your script and runs it">Reveal answer</button></span>`:""}</span></li>`).join("")}
      ${m.answer?`<li class="task ${ans?"done":""}"><span class="box">${ans?"✓":"?"}</span><span class="t">Report to the IMT: <b>${m.answer.label}</b>${ans?` — <code>${esc(ans)}</code>`:`<span class="why">Run the code, read the number in the console, type it here.</span><span class="answer"><input id="ans" placeholder="your number" aria-label="${m.answer.label}"><button id="ansBtn">Submit</button></span><span class="stepbtns">${m.answer.tpl?`<button class="tplbtn" data-tpl="ans">Starter code</button>`:""}<button class="revbtn" data-rev="ans">Reveal answer</button></span>`}</span></li>`:""}
    </ul>
    <div class="reuse"><b>Use this anywhere</b>${m.reuse}</div>
    <div class="task ${qz.right?"done":""}" style="flex-direction:column;gap:2px"><span class="optional">Bonus check-in · +20 XP · optional</span><span><b>${m.quiz.q}</b></span><span class="choices">${m.quiz.opts.map((o,i)=>`<button class="choice ${qz.right&&i===m.quiz.a?"right":""} ${(qz.wrong||[]).includes(i)?"wrong":""}" data-q="${i}" ${qz.right?"disabled":""}>${o}</button>`).join("")}</span>${qz.right?`<span class="why">${qz.revealed?"Answer: ":""}${m.quiz.why}</span>`:`<span><button class="revbtn" id="quizRev">Show answer</button></span>`}</div>
    <div id="hintArea">${S.hints[S.mi]?`<div class="hintbox"><b>Hint.</b> ${m.hint}</div>`:""}${S.sol[S.mi]?`<div class="hintbox" style="margin-top:8px"><b>Full solution</b> (added to your script: press Run all)<pre>${esc(m.sol)}</pre></div>`:""}</div>
    <div class="mfoot">
      <button class="btn" id="hintBtn" ${S.hints[S.mi]?"disabled":""}>Hint (−5 XP)</button>
      <button class="btn" id="solBtn" ${S.sol[S.mi]?"disabled":""}>I'm stuck: full solution (−20 XP)</button>
      <button class="btn" id="catchBtn" title="Rebuilds every object from earlier missions using the model answers">Catch me up</button>
      <span style="flex:1"></span>
      ${S.mi<MISSIONS.length-1?`<button class="btn" id="skipBtn" title="Move on; earlier objects are rebuilt for you">Skip</button>`:""}
      <button class="btn primary" id="nextBtn" ${missionComplete(S.mi)?"":"disabled"}>${S.mi===MISSIONS.length-1?"Finish & debrief":"Next mission →"}</button>
    </div></div>`;
  el.querySelectorAll("[data-tpl]").forEach(b=>b.onclick=()=>{const k=b.dataset.tpl;const code=k==="ans"?m.answer.tpl:m.tasks[+k].tpl;appendSrc(code);
    const n=code.indexOf("___");const start=src.value.lastIndexOf(code);src.focus();if(n>=0){src.setSelectionRange(start+n,start+n+3);toast("Replace the highlighted ___ then press Run line")}else{src.setSelectionRange(start,start);toast("Starter code added: press Run line (Ctrl+Enter)")}});
  const ab=$("ansBtn");if(ab){const go=()=>{const v=$("ans").value.trim();if(!v)return;if(m.answer.check(v)){S.answered[S.mi]=v;addXP(40,"Correct report");checkMission();renderRight()}else{toast("Not quite: check the number in your console output");$("ans").select()}};ab.onclick=go;$("ans").onkeydown=e=>{if(e.key==="Enter")go()}}
  el.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const i=+b.dataset.q;const q=S.quiz[S.mi]=S.quiz[S.mi]||{wrong:[]};if(i===m.quiz.a){q.right=true;addXP(q.wrong.length?10:20,"Check-in")}else{q.wrong.push(i)}checkMission();renderRight()});
  el.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>{const k=b.dataset.rev;if(k==="ans")revealAnswer();else revealTask(+k)});
  const qr=$("quizRev");if(qr)qr.onclick=revealQuiz;
  $("catchBtn").onclick=()=>{const r=catchUp(S.mi);if(!r.length)toast("You're already caught up");checkMission()};
  $("hintBtn").onclick=()=>{S.hints[S.mi]=true;addXP(-5);renderRight()};
  $("solBtn").onclick=()=>{S.sol[S.mi]=true;addXP(-20);appendSrc(m.sol);renderRight()};
  const sk=$("skipBtn");if(sk)sk.onclick=()=>{if(!S.done[S.mi])S.done[S.mi]="skipped";jumpTo(S.mi+1)};
  $("nextBtn").onclick=()=>{if(!missionComplete(S.mi))return;if(!S.done[S.mi]){S.done[S.mi]=true;addXP(50,m.code+" complete")}if(S.mi===MISSIONS.length-1)finish();else startMission(S.mi+1)};
  steps();
}
function missionComplete(i){const m=MISSIONS[i];return m.tasks.every((t,k)=>S.done[i+"t"+k])&&(!m.answer||S.answered[i])}
function previewXlsx(f,sheet){const X=FILES[f];const names=Object.keys(X.sheets);sheet=sheet||names[0];const d=X.sheets[sheet]();const n=Math.min(d.nrow,60);const L=i=>String.fromCharCode(65+i);
  const md=modal(`<div class="src" style="font:600 11px var(--mono);color:var(--muted)">EXCEL PREVIEW · read-only</div><h2 style="font-size:18px">${f}</h2>
  <p style="font-size:13px;margin:4px 0 0">Each <b>sheet tab</b> becomes one table in R. Row 1 holds the column names, and every row after it is one record.</p>
  <div class="xl" style="margin-top:10px"><table><thead><tr><th></th>${d.names.map((c,i)=>`<th>${L(i)}</th>`).join("")}</tr></thead><tbody><tr><td class="rn">1</td>${d.names.map(c=>`<td><b>${esc(c)}</b></td>`).join("")}</tr>${[...Array(n).keys()].map(r=>`<tr><td class="rn">${r+2}</td>${d.names.map(c=>`<td>${esc(fmtEl(d.cols[c][r],false))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <div class="sheetTabs" role="tablist">${names.map(s=>`<button data-sh="${s}" aria-selected="${s===sheet}">${s}</button>`).join("")}</div>
  <p style="font-size:13px;margin:10px 0 0">In R: <code>${esc(`read_excel("${f}", sheet = "${sheet}")`)}</code>${d.nrow>n?` · showing ${n} of ${d.nrow} rows`:""}</p>
  <div class="mfoot" style="margin-top:12px"><button class="btn primary" id="xlIns">Add this line to my script</button><span style="flex:1"></span><button class="btn" id="closeBtn">Close</button></div>`);
  md.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>previewXlsx(f,b.dataset.sh));$("closeBtn").onclick=closeModal;
  $("xlIns").onclick=()=>{appendSrc(`${sheet==="linelist"?"cases":sheet==="weekly_counts"?"weekly":sheet} <- read_excel("${f}", sheet = "${sheet}")`);closeModal();toast("Added to your script")}}
function checkMission(){const m=MISSIONS[S.mi];if(!m)return;let changed=false;
  m.tasks.forEach((t,k)=>{const key=S.mi+"t"+k;if(!S.done[key]){let ok=false;try{ok=t.c()}catch(e){}if(ok){S.done[key]=true;changed=true;S.stats.lastProgressAt=Date.now();addXP(S.revealed[key]?5:20,S.revealed[key]?"Step done (revealed)":"Task done")}}});
  if(changed||tab==="mission")renderRight();}
function startMission(i){S.mi=i;appendSrc(`\n# ---- ${MISSIONS[i].code}: ${MISSIONS[i].title} ----`);tab="mission";document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab==="mission"));checkMission();renderRight();save()}

// ---- modals ----
function modal(html){$("modalRoot").innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="card">${html}</div></div>`;return $("modalRoot").firstChild}
function closeModal(){$("modalRoot").innerHTML=""}
function intro(){const md=modal(`<div class="src" style="font:600 11px var(--mono);color:var(--muted);letter-spacing:.08em">SITUATION REPORT · 22 SEP 2026 · 06:00</div>
  <h2>Yellow Fever in Lomera. You have 48 hours.</h2>
  <p>A neighbouring district has confirmed a Yellow Fever outbreak. Your job: design a targeted vector-control and vaccination plan for the semi-rural border zone of <b>Kivara District</b>, and present it to the National Yellow Fever Incident Management Team.</p>
  <p>You have an Excel workbook from the surveillance officer, open-source data (WorldPop, GRID3, Google Earth Engine, OpenStreetMap) and R. Work through ${MISSIONS.length} missions; the last one produces the map you'll brief with.</p>
  <p style="font-size:13px;margin-bottom:4px"><b>New to R? You won't get stuck:</b></p>
  <ol style="font-size:13px;margin-top:0;padding-left:20px">
    <li>Each step has a <b>Starter code</b> button. It adds a line to your script with a blank <code>___</code> for you to fill in.</li>
    <li>Press <b>▶ Run line</b> (or Ctrl+Enter). The step ticks itself off when your code works.</li>
    <li><b>Explain as I go</b> prints a plain-English note the first time you use each function.</li>
    <li>Errors come with a <b>Hint:</b> line that tells you what to fix.</li>
    <li>Still stuck? <b>Reveal answer</b> on any step runs the right code for you, so you can always keep going.</li>
    <li>The <b>Playbook</b> tab turns every step into a template for your own projects.</li>
  </ol>
  <p style="color:var(--muted);font-size:12.5px">Kivara, Lomera and all data here are fictional, simulated for training.</p>
  <div class="mfoot"><button class="btn primary" id="go">Accept mission</button></div>`);
  $("go").onclick=()=>{closeModal();if(!S.started){S.started=true;startMission(0)}src.focus()}}
let dl=null;
async function getDL(){if(dl)return dl;if(window.claude&&window.claude.use){try{dl=await window.claude.use("downloads")}catch(e){}}
  if(!dl&&!window.claude)dl={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:"saved"}}};return dl}
async function finish(){
  S.finished=true;save();if(!Object.values(S.hints).some(Boolean)&&!Object.values(S.sol).some(Boolean))award("nohints");if(!Object.values(S.sol).some(Boolean))award("selfmade");
  const img=S.savedCanvas?S.savedCanvas.toDataURL("image/png"):null;
  const md=modal(`<div class="src" style="font:600 11px var(--mono);color:var(--muted);letter-spacing:.08em">DEBRIEF · NATIONAL YF IMT</div>
    <h2>Plan delivered with ${Math.floor(S.minutes/60)}h ${S.minutes%60}m to spare</h2>
    <p><b>${S.xp} XP</b> · rank <b>${rankOf(S.xp)}</b></p>
    <div class="badges">${Object.entries(BADGES).map(([k,n])=>`<span class="badge ${S.badges[k]?"got":""}">${S.badges[k]?"★ ":""}${n}</span>`).join("")}</div>
    ${img?`<p style="margin-top:14px"><img src="${img}" alt="Your exported Kivara Yellow Fever map"></p>`:""}
    <p style="font-size:13px;color:var(--muted)">Discuss: Ranking by population alone picks the big western towns — but the cases cluster in the east, where two facilities have no cold chain. Did your hubs cover the outbreak? Would weighting by <code>cases_5km</code> or by children under 5 change the choice? Should fixing a fridge at Mbere Hospital be part of the plan? Where would you send vector-control teams first?</p>
    <p style="font-size:13px"><b>Take it home:</b> the <b>Playbook</b> tab turns these missions into a six-step template you can reuse for cholera, malaria, measles, PMTCT, or any project with your own Excel files.</p>
    <div class="mfoot"><button class="btn" id="pbGo">Open Playbook</button><button class="btn primary" id="dlBtn" ${img?"":"hidden"}>Save map PNG</button><span id="dlNote" style="font-size:12px;color:var(--muted)"></span><span style="flex:1"></span><button class="btn" id="closeBtn">Keep exploring</button></div>`);
  $("closeBtn").onclick=closeModal;$("pbGo").onclick=()=>{closeModal();tab="playbook";document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab==="playbook"));renderRight()};
  const btn=$("dlBtn");if(btn)btn.onclick=async()=>{try{await getDL();
      if(!dl){$("dlNote").textContent="Saving isn't available here — right-click the map and choose “Save image as…”.";return}
      const blob=await new Promise(r=>S.savedCanvas.toBlob(r,"image/png"));await dl.save({filename:S.savedName||"kivara_yf_hubs.png",data:blob});$("dlNote").textContent="Saved."}
    catch(e){$("dlNote").textContent=e&&e.code==="declined"?"Save cancelled.":"Couldn't save — right-click the map and choose “Save image as…”."}};
}

// ---- persistence (per-viewer convenience) ----
const KEY="kivara-outbreak-console-v3";
function save(){try{localStorage.setItem(KEY,JSON.stringify({xp:S.xp,mi:S.mi,done:S.done,answered:S.answered,quiz:S.quiz,hints:S.hints,sol:S.sol,badges:S.badges,minutes:S.minutes,explain:S.explain,started:S.started,flags:S.flags,revealed:S.revealed,stats:S.stats,finished:S.finished,src:src.value}))}catch(e){}if(window.Sync)Sync.push()}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(!d)return false;Object.assign(S,d);src.value=d.src||HEADER;return true}catch(e){return false}}
$("resetBtn").onclick=()=>{const md=modal(`<h2>Start over?</h2><p>This clears your XP, missions and script on this device.</p><div class="mfoot"><button class="btn primary" id="yes">Start over</button><button class="btn" id="no">Cancel</button></div>`);
  $("no").onclick=closeModal;$("yes").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};

$("plot").title="Click to enlarge";$("plot").style.cursor="zoom-in";
$("plot").onclick=()=>{const md=modal(`<img src="${$("plot").toDataURL("image/png")}" alt="Current plot, enlarged"><div class="mfoot" style="margin-top:10px"><span style="flex:1"></span><button class="btn" id="closeBtn">Close</button></div>`);md.querySelector(".card").style.maxWidth="1100px";$("closeBtn").onclick=closeModal;md.onclick=e=>{if(e.target===md)closeModal()}};
$("explainBtn").onclick=()=>{S.explain=!S.explain;$("explainBtn").textContent="Explain as I go: "+(S.explain?"On":"Off");$("explainBtn").setAttribute("aria-pressed",S.explain);save()};
// ---- boot ----
Plot.init();
{const c=Plot.ctx;c.fillStyle="#8a9a93";c.font="15px sans-serif";c.textAlign="center";c.fillText("Plots and maps appear here",450,320)}
const restored=load();
if(!restored)src.value=HEADER;
gutter();tick(0);$("explainBtn").textContent="Explain as I go: "+(S.explain?"On":"Off");$("xp").textContent=S.xp;$("rank").textContent=rankOf(S.xp);
out("R version 4.4.2 (2024-10-31) -- \"Pile of Leaves\"\nPlatform: x86_64-w64-mingw32/x64 · Kivara training sandbox\n\nType R code in the script and press Ctrl+Enter, or type here and press Enter.","msg");
function begin(){if(restored&&S.started){out("\nWelcome back. Your progress and script were restored.","ok");catchUp(S.mi);MISSIONS[S.mi].tasks.forEach((t,k)=>{if(S.done[S.mi+"t"+k]&&t.full){MUTE=true;try{runSource(t.full,{echo:false,stats:false})}finally{MUTE=false}}});checkMission();renderRight()}else intro()}
if(window.Sync&&Sync.configured())Sync.join(begin);else begin();
steps();
</script>
